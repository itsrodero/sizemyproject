<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:1500px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(900px 700px at 90% -5%,#ffedd5,transparent 60%),#fafaf9;color:#1c1917;position:relative}
.wrap{padding:84px 80px 0}
.logo{display:flex;align-items:center;gap:18px;font-size:42px;font-weight:700}
.logo b{color:#c2410c}
.label{display:inline-block;margin-top:64px;border:3px solid #c2410c;color:#9a3412;border-radius:999px;padding:10px 26px;font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:92px;line-height:1.04;margin:34px 0 0;letter-spacing:-2px;font-weight:800}
p{font-size:40px;line-height:1.3;color:#44403c;margin:30px 0 0;max-width:840px}
.art{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);width:330px;height:330px;border-radius:64px;background:#fff;border:3px solid #e7e5e4;box-shadow:0 12px 40px rgba(28,25,23,.08);display:flex;align-items:center;justify-content:center}
.art svg{width:250px;height:250px;color:#c2410c}
.foot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#c2410c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 80px;box-sizing:border-box}
.cta{font-size:46px;font-weight:800}
.site{font-size:36px;font-weight:600;opacity:.95}
</style></head><body>
<div class="wrap">
  <div class="logo"><svg width="68" height="68" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#c2410c"/><path d="M7 23h18v-4h-3v2h-2v-3h-2v3h-2v-2h-2v2h-2v-3h-2v3H9v-2H7z" fill="#fff"/><path d="M9 13l7-5 7 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SizeMy<b>Project</b></span></div>
  <div class="label" id="label"></div>
  <h1 id="headline"></h1>
  <p id="sub"></p>
</div>
<div class="art"><svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg></div>
<div class="foot"><span class="cta" id="cta"></span><span class="site">sizemyproject.com</span></div>
<script>
var q = new URLSearchParams(location.hash.slice(1));
document.getElementById('label').textContent = q.get('l') || '';
document.getElementById('headline').textContent = q.get('h') || '';
document.getElementById('sub').textContent = q.get('s') || '';
document.getElementById('cta').textContent = (q.get('c') || '') + ' →';
document.getElementById('icon').innerHTML = q.get('i') || '';
// Long headlines shrink so they never run into the illustration.
var h = document.getElementById('headline'), size = 92;
while (h.getBoundingClientRect().bottom > 760 && size > 60) { size -= 4; h.style.fontSize = size + 'px'; }
</script>
</body></html>
