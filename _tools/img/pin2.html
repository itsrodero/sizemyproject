<!doctype html><html><head><meta charset="utf-8"><style>
/* Second-round pin: dark "blueprint" look, so it reads as a new image next to the first-round pins. */
html,body{margin:0;width:1000px;height:1500px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
body{background:
  linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px) 0 0/50px 50px,
  linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px) 0 0/50px 50px,
  radial-gradient(800px 600px at 15% 0%,rgba(234,88,12,.35),transparent 60%),#1c1917;color:#fafaf9;position:relative}
.wrap{padding:84px 80px 0}
.logo{display:flex;align-items:center;gap:18px;font-size:42px;font-weight:700}
.logo b{color:#fb923c}
.label{display:inline-block;margin-top:70px;background:#ea580c;color:#fff;border-radius:999px;padding:12px 28px;font-size:28px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:100px;line-height:1.02;margin:36px 0 0;letter-spacing:-2px;font-weight:800}
p{font-size:42px;line-height:1.3;color:#d6d3d1;margin:30px 0 0;max-width:840px}
.art{position:absolute;right:80px;bottom:240px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06);border:4px solid #fb923c;display:flex;align-items:center;justify-content:center}
.art svg{width:200px;height:200px;color:#fb923c}
.badge{position:absolute;left:80px;bottom:300px;font-size:36px;font-weight:700;color:#fed7aa;line-height:1.35}
.badge span{display:block}
.foot{position:absolute;left:0;right:0;bottom:0;height:170px;background:#fafaf9;color:#1c1917;display:flex;align-items:center;justify-content:space-between;padding:0 80px;box-sizing:border-box}
.cta{font-size:46px;font-weight:800;color:#c2410c}
.site{font-size:36px;font-weight:700}
</style></head><body>
<div class="wrap">
  <div class="logo"><svg width="68" height="68" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#ea580c"/><path d="M7 23h18v-4h-3v2h-2v-3h-2v3h-2v-2h-2v2h-2v-3h-2v3H9v-2H7z" fill="#fff"/><path d="M9 13l7-5 7 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SizeMy<b>Project</b></span></div>
  <div class="label" id="label"></div>
  <h1 id="headline"></h1>
  <p id="sub"></p>
</div>
<div class="badge"><span>✓ Free</span><span>✓ No sign-up</span><span>✓ Works on your phone</span></div>
<div class="art"><svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></svg></div>
<div class="foot"><span class="cta" id="cta"></span><span class="site">sizemyproject.com</span></div>
<script>
var q = new URLSearchParams(location.hash.slice(1));
document.getElementById('label').textContent = q.get('l') || '';
document.getElementById('headline').textContent = q.get('h') || '';
document.getElementById('sub').textContent = q.get('s') || '';
document.getElementById('cta').textContent = (q.get('c') || '') + ' →';
document.getElementById('icon').innerHTML = q.get('i') || '';
// Long headlines and subtitles shrink so they never run into the badges.
var h = document.getElementById('headline'), size = 100;
while (h.getBoundingClientRect().bottom > 700 && size > 60) { size -= 4; h.style.fontSize = size + 'px'; }
var s = document.getElementById('sub'), ss = 42;
while (s.getBoundingClientRect().bottom > 1060 && ss > 28) { ss -= 2; s.style.fontSize = ss + 'px'; }
</script>
</body></html>
